# Copy to secrets.yaml and fill in. secrets.yaml is gitignored.
wifi_ssid: "your-ssid"
wifi_password: "your-password"
ap_password: "fallback-ap-password"

# 32-byte base64 key. Generate with:
#   python3 -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
api_key: "REPLACE_WITH_BASE64_KEY"

# Optional basic auth for the HTTP upload page on port 8080.
# Leave both empty to allow uploads without a login (LAN only).
upload_username: ""
upload_password: ""

# Manifest served by Home Assistant for device-side OTA updates. Copy
# firmware.ota.bin + manifest.json to /config/www/jc3248w535/ (see README).
firmware_manifest_url: "http://homeassistant.local:8123/local/jc3248w535/manifest.json"
